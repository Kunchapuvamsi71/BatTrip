name: Deploy BatTrip Frontend

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. Get the repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure GitHub Pages
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # 3. Prepare website
      - name: Prepare website
        run: |
          echo "Creating website folder..."
          mkdir -p site

          echo "Copying main index.html..."
          cp index.html site/

          echo "Copying Frontend folder..."
          cp -R Frontend site/

          echo "Copying static files if available..."

          if [ -d "Frontend/assets" ]; then
            echo "Frontend/assets found"
          fi

          echo "Website files:"
          find site -maxdepth 4 -type f | sort

          echo "Checking index.html..."
          test -f site/index.html

          echo "index.html found successfully!"

      # 4. Upload website to GitHub Pages
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      # 5. Deploy website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
