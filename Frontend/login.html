<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - BatTrip & SpiderRoam</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <header>
        <div class="container">

            <nav>

                <div class="logo">
                    🦇 BatTrip & SpiderRoam 🕷️
                </div>

                <a href="Index.html">
                    Home
                </a>

            </nav>

        </div>
    </header>


    <main>

        <div class="container">

            <div class="card">

                <h1>Login</h1>

                <p>
                    Login to manage your trips and recommendations.
                </p>


                <!-- LOGIN FORM -->

                <form id="loginForm">

                    <label for="email">
                        Email
                    </label>

                    <input type="email" id="email" placeholder="Enter your email" required>


                    <label for="password">
                        Password
                    </label>

                    <input type="password" id="password" placeholder="Enter your password" required>


                    <button type="submit">
                        Login
                    </button>

                </form>


                <!-- LOGIN MESSAGE -->

                <p id="loginMessage"></p>


                <p>
                    Don't have an account?
                    <a href="register.html">
                        Register here
                    </a>
                </p>

            </div>

        </div>

    </main>


    <!-- IMPORTANT:
     JavaScript folder is named "JavaScript"
-->

    <script src="JavaScript/auth.js"></script>

</body>

</html>
