<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tourist Recommendations | BatTrip & SpiderRoam</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 24px;
        }

        header p {
            margin-top: 6px;
            font-size: 14px;
        }

        .container {
            max-width: 1000px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .search-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
        }

        .search-box h2 {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #111827;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #resultTitle {
            margin-bottom: 15px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 18px;
        }

        .card {
            background: white;
            padding: 18px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .card h3 {
            margin-bottom: 8px;
            font-size: 20px;
        }

        .card p {
            margin: 7px 0;
            line-height: 1.4;
        }

        .score {
            font-weight: bold;
            margin-top: 12px;
        }

        .reason {
            background: #f0f4ff;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .empty {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            text-decoration: none;
            color: #111827;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <h1>🦇 BatTrip & SpiderRoam 🕷️</h1>
        <p>AI-Powered Tourist Recommendations</p>
    </header>

    <div class="container">

        <div class="search-box">

            <h2>🤖 Find Recommended Places</h2>

            <label>Destination</label>

            <input type="text" id="destination" placeholder="Example: Munnar">

            <label>Travel Interest</label>

            <select id="interest">
                <option value="Nature">Nature</option>
                <option value="Adventure">Adventure</option>
                <option value="Beach">Beach</option>
                <option value="Culture">Culture</option>
                <option value="History">History</option>
                <option value="Wildlife">Wildlife</option>
                <option value="Spiritual">Spiritual</option>
                <option value="Food">Food</option>
                <option value="Photography">Photography</option>
                <option value="Relaxation">Relaxation</option>
            </select>

            <label>Budget for Activities (₹)</label>

            <input type="number" id="budget" placeholder="Example: 1000" value="1000">

            <button id="recommendButton" onclick="findRecommendations()">
                🔍 Find Recommendations
            </button>

        </div>

        <h2 id="resultTitle">
            Recommended Tourist Places
        </h2>

        <div id="results" class="cards">

            <div class="empty">
                Enter a destination and click Find Recommendations.
            </div>

        </div>

        <a href="planner.html" class="back">
            ← Back to Trip Planner
        </a>

    </div>


    <script>

        const API_BASE_URL = "http://127.0.0.1:5000";


        /* Read destination from URL */

        const params = new URLSearchParams(
            window.location.search
        );

        const selectedDestination =
            params.get("destination");

        if (selectedDestination) {

            document.getElementById("destination").value =
                selectedDestination;

        }


        /* Find ML recommendations */

        async function findRecommendations() {

            const destination =
                document.getElementById("destination")
                    .value
                    .trim();

            const interest =
                document.getElementById("interest")
                    .value;

            const budget =
                Number(
                    document.getElementById("budget").value
                ) || 0;

            const results =
                document.getElementById("results");

            const resultTitle =
                document.getElementById("resultTitle");

            const button =
                document.getElementById("recommendButton");


            /* Validate destination */

            if (destination === "") {

                results.innerHTML = `
            <div class="empty">
                ⚠️ Please enter a destination.
            </div>
        `;

                return;
            }


            /* Loading */

            button.disabled = true;

            button.innerText =
                "🤖 AI is finding recommendations...";

            results.innerHTML = `
        <div class="empty">
            ⏳ Getting AI recommendations...
        </div>
    `;


            try {

                const url =
                    `${API_BASE_URL}/api/recommendations` +
                    `?place=${encodeURIComponent(destination)}` +
                    `&interest=${encodeURIComponent(interest)}` +
                    `&budget=${encodeURIComponent(budget)}`;


                const response =
                    await fetch(url);


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Recommendation request failed"
                    );

                }


                const recommendations =
                    data.recommendations || [];


                if (recommendations.length === 0) {

                    results.innerHTML = `
                <div class="empty">

                    😔 No tourist places found
                    for <strong>${destination}</strong>.

                    <br><br>

                    Try:

                    <strong>
                        Munnar, Kochi, Alappuzha,
                        Varkala, Ooty, Goa,
                        Jaipur or Agra
                    </strong>

                </div>
            `;

                    resultTitle.innerText =
                        "Tourist Recommendations";

                    return;
                }


                resultTitle.innerText =
                    "🤖 AI Recommended Places in " +
                    recommendations[0].destination;


                results.innerHTML = "";


                recommendations.forEach(function (place) {

                    const score =
                        Number(place.score || 0);


                    results.innerHTML += `

                <div class="card">

                    <h3>
                        📍 ${place.name}
                    </h3>

                    <p>
                        <strong>State:</strong>
                        ${place.state || "N/A"}
                    </p>

                    <p>
                        <strong>Type:</strong>
                        ${place.type || "N/A"}
                    </p>

                    <p>
                        ⭐ <strong>Rating:</strong>
                        ${place.rating || 0}/5
                    </p>

                    <p>
                        🔥 <strong>Popularity:</strong>
                        ${place.popularity || 0}/100
                    </p>

                    <p>
                        💰 <strong>Approx. Cost:</strong>
                        ₹${place.cost || 0}
                    </p>

                    <p>
                        ⏱️ <strong>Duration:</strong>
                        ${place.duration || 0} hours
                    </p>

                    <p>
                        ${place.description || ""}
                    </p>

                    <div class="score">

                        🤖 AI Recommendation Score:
                        ${score}/100

                    </div>

                    <div class="reason">

                        💡 <strong>
                            Why recommended?
                        </strong>

                        <br>

                        ${place.reason ||
                        "Recommended based on tourism data and AI similarity."}

                    </div>

                </div>

            `;

                });


            } catch (error) {

                console.error(
                    "Recommendation error:",
                    error
                );


                results.innerHTML = `

            <div class="empty">

                ❌ Unable to connect to the
                recommendation server.

                <br><br>

                Make sure Flask is running at:

                <br><br>

                <strong>
                    http://127.0.0.1:5000
                </strong>

            </div>

        `;

            } finally {

                button.disabled = false;

                button.innerText =
                    "🔍 Find Recommendations";

            }

        }

    </script>

</body>

</html>
